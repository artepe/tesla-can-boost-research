# Copy these lines into the secrets.yaml of your ESPHome Device Builder.
# Kopioi rivit ESPHome Builderin secrets.yaml-tiedostoon ja täytä arvot.
# The UDP key MUST be identical on the charger node and the meter node.

# Shared by loadpilot-twc.yaml (S3) and loadpilot-meter.yaml (C3)
loadpilot_api_key: "BASE64_32_BYTE_KEY"        # ESPHome generates one per device
loadpilot_ota_password: "CHANGE_ME"
loadpilot_udp_key: "CHANGE_ME_LONG_RANDOM"     # same on both nodes
loadpilot_ap_password: "CHANGE_ME"
loadpilot_wifi_ssid: "YOUR_WIFI"
loadpilot_wifi_password: "YOUR_WIFI_PASSWORD"

# tesla-ble.yaml (second S3, optional)
tesla_ble_api_key: "BASE64_32_BYTE_KEY"
tesla_ble_mac_address: "AA:BB:CC:DD:EE:FF"     # Android + nRF Connect, name S…C
tesla_vin: "YOUR_VIN"
